<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Ring base -->
  <circle cx="40" cy="40" r="34" fill="none" stroke="#2a2520" stroke-width="1.8"/>
  <!-- Ring gold arc (top half) -->
  <circle cx="40" cy="40" r="34" fill="none" stroke="#c9a84c" stroke-width="1.8"
    stroke-dasharray="106.81 106.81" stroke-dashoffset="53.40"
    transform="rotate(-90 40 40)"/>

  <!-- Trunk -->
  <rect x="38" y="42" width="4" height="22" rx="2" fill="#f5f2ec"/>

  <!-- Left branch -->
  <path d="M40 44 Q28 36 26 22" stroke="#c9a84c" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Centre branch -->
  <path d="M40 44 Q40 30 40 16" stroke="#f5f2ec" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <!-- Right branch -->
  <path d="M40 44 Q52 36 54 22" stroke="#c9a84c" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Canopy nodes -->
  <circle cx="26" cy="20" r="4"   fill="#c9a84c"/>
  <circle cx="40" cy="14" r="5.5" fill="#f5f2ec"/>
  <circle cx="54" cy="20" r="4"   fill="#c9a84c"/>
</svg>

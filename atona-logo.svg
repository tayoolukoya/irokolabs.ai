<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B8FFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6E5CFF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="subtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8AEFF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#6E5CFF;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="400" cy="400" r="360" fill="#0A0A14"/>
  
  <!-- Outer ring - compass reference -->
  <circle cx="400" cy="400" r="320" fill="none" stroke="url(#subtle)" stroke-width="1.5"/>
  
  <!-- The 'A' mark - stylized as a guiding arrow/path -->
  <!-- Left leg -->
  <path d="M 260 600 L 380 220 L 400 220" fill="none" stroke="url(#glow)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right leg -->
  <path d="M 400 220 L 420 220 L 540 600" fill="none" stroke="url(#glow)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crossbar - slightly angled upward to suggest forward motion -->
  <path d="M 310 480 L 490 440" fill="none" stroke="url(#glow)" stroke-width="24" stroke-linecap="round"/>
  
  <!-- North star / guide point at the apex -->
  <circle cx="400" cy="190" r="12" fill="#9B8FFF"/>
  <circle cx="400" cy="190" r="24" fill="none" stroke="#9B8FFF" stroke-width="2" opacity="0.5"/>
  <circle cx="400" cy="190" r="40" fill="none" stroke="#9B8FFF" stroke-width="1" opacity="0.2"/>
  
  <!-- Small cardinal dots on the ring -->
  <circle cx="400" cy="80" r="4" fill="#9B8FFF" opacity="0.6"/>
  <circle cx="720" cy="400" r="4" fill="#9B8FFF" opacity="0.3"/>
  <circle cx="400" cy="720" r="4" fill="#9B8FFF" opacity="0.3"/>
  <circle cx="80" cy="400" r="4" fill="#9B8FFF" opacity="0.3"/>
</svg>